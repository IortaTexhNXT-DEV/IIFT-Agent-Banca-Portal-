name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --verbose

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iift
          POSTGRES_PASSWORD: iift_ci_pw
          POSTGRES_DB: iift_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U iift" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://iift:iift_ci_pw@localhost:5432/iift_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.21.0
      - run: npm ci
      - name: Generate database client
        run: npx prisma generate
        working-directory: apps/api
      - name: Formatting
        run: npx prettier --check "apps/*/src/**/*.{ts,tsx}" "apps/api/test/**/*.ts" "apps/api/prisma/**/*.ts"
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck --workspaces
      - name: Unit tests
        run: npm test --workspaces
      - name: End-to-end API tests
        run: npm run test:e2e --workspace apps/api
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Software bill of materials
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  images:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile --target runtime -t salesverse-api:${{ github.sha }} .
      - run: docker build -f apps/web/Dockerfile -t salesverse-web:${{ github.sha }} .
      - name: Container vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: salesverse-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

# SalesVerse 2.0 web tier: serves the SPA and forwards /api to the API service.
# TLS is terminated here (or at the upstream load balancer / WAF).

server_tokens off;

upstream salesverse_api {
  server api:3000;
  keepalive 16;
}

limit_req_zone $binary_remote_addr zone=api_rate:10m rate=20r/s;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 26m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    limit_req zone=api_rate burst=40 nodelay;
    proxy_pass http://salesverse_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 120s;
  }

  # Inbound system-to-system APIs: restrict to IITH system addresses in production.
  location /api/v1/integration/ {
    # allow 10.0.0.0/8;
    # deny all;
    proxy_pass http://salesverse_api;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }
}
